name = "cirisportal"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages configuration
pages_build_output_dir = ".vercel/output/static"

# KV Namespace for key storage (create with: wrangler kv:namespace create KEYS)
# [[kv_namespaces]]
# binding = "KEYS"
# id = "your-kv-namespace-id"

# Environment variables
[vars]
NEXT_PUBLIC_API_URL = "https://api.registry.ciris.ai"

# Environment variables (for production)
[env.production.vars]
NEXT_PUBLIC_API_URL = "https://api.registry.ciris.ai"
NEXTAUTH_URL = "https://portal.ciris.ai"

# Secrets (set with: wrangler secret put <KEY>)
# - NEXTAUTH_SECRET
# - GOOGLE_CLIENT_ID
# - GOOGLE_CLIENT_SECRET
# - KEY_ENCRYPTION_KEY (for envelope encryption of custodied keys)
