# ===========================================
# CIRISPortal - Cloudflare Pages Configuration
# ===========================================

name = "cirisportal"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Pages build output directory (for @cloudflare/next-on-pages)
pages_build_output_dir = ".vercel/output/static"

# ===========================================
# KV Namespace for Key Storage
# ===========================================
# Create with: wrangler kv:namespace create KEYS
# Uncomment after creating namespace:
# [[kv_namespaces]]
# binding = "KEYS"
# id = "your-kv-namespace-id"

# ===========================================
# Development Environment
# ===========================================
[env.development]
name = "cirisportal-dev"

[env.development.vars]
APP_ENV = "devtest"
NEXT_PUBLIC_APP_ENV = "devtest"
NEXT_PUBLIC_REGISTRY_API_URL = "/api/registry"
REGISTRY_GRPC_URL = "localhost:50052"
NEXTAUTH_URL = "http://localhost:3000"

# ===========================================
# Staging Environment
# ===========================================
[env.staging]
name = "cirisportal-staging"

[env.staging.vars]
APP_ENV = "stage"
NEXT_PUBLIC_APP_ENV = "stage"
NEXT_PUBLIC_REGISTRY_API_URL = "/api/registry"
REGISTRY_GRPC_URL = "registry-staging.ciris.ai:50052"
NEXTAUTH_URL = "https://portal-staging.ciris.ai"

# ===========================================
# Production Environment
# ===========================================
[env.production]
name = "cirisportal"

[env.production.vars]
APP_ENV = "prod"
NEXT_PUBLIC_APP_ENV = "prod"
NEXT_PUBLIC_REGISTRY_API_URL = "/api/registry"
REGISTRY_GRPC_URL = "registry.ciris.ai:50052"
NEXTAUTH_URL = "https://portal.ciris.ai"
ALLOWED_EMAIL_DOMAINS = "ciris.ai"

# ===========================================
# Secrets (all environments)
# ===========================================
# Set secrets using wrangler CLI:
#
# Development/Staging:
#   wrangler secret put NEXTAUTH_SECRET --env staging
#   wrangler secret put GOOGLE_CLIENT_ID --env staging
#   wrangler secret put GOOGLE_CLIENT_SECRET --env staging
#   wrangler secret put KEY_ENCRYPTION_KEY --env staging
#
# Production:
#   wrangler secret put NEXTAUTH_SECRET --env production
#   wrangler secret put GOOGLE_CLIENT_ID --env production
#   wrangler secret put GOOGLE_CLIENT_SECRET --env production
#   wrangler secret put KEY_ENCRYPTION_KEY --env production
#
# Generate secrets:
#   NEXTAUTH_SECRET: openssl rand -base64 32
#   KEY_ENCRYPTION_KEY: openssl rand -base64 32
